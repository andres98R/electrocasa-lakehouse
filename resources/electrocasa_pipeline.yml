resources:
  pipelines:
    electrocasa_pipeline:
      name: "ElectroCasa Lakehouse Pipeline - ${bundle.target}"

      catalog: ${var.catalog}
      schema: default

      configuration:
        electrocasa_catalog: ${var.catalog}

      serverless: true

      root_path: ../src/electrocasa

      libraries:
        - glob:
            include: ../src/electrocasa/transformations/**